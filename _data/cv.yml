summary: >-
  AI engineer and applied scientist with a PhD in AI and 10 years of turning NLP and LLM research
  into production systems. I currently lead the multi-agent AI platform at bexio, have consulted for
  venture-backed AI startups, and teach LLMs and AI agents at Lucerne University of Applied Sciences (HSLU).

experience:
  - org: "bexio AG"
    role: "Senior AI Engineer"
    location: "Rapperswil, Switzerland"
    dates: "Aug 2025 – Present"
    bullets:
      - "**Technical lead and applied scientist for bexio Intelligence.** Set the technical strategy and architecture of a production multi-agent platform and took it from lab prototype to a **core 2026 company OKR**, with a tiered rollout to **100,000+ SME customers**."
      - "**Architected and deployed high-concurrency multi-agent pipelines** that turn complex, non-linear financial workflows into automated execution, using low-latency **semantic caching** to keep production compute costs under control."
      - "**Designed and built a plug-and-play evaluation platform** that stress-tests multi-turn reasoning traces, conversation safety and workflow logic in simulation, so every agent change is validated before it reaches production."
      - "**Bridged engineering and cross-functional leadership.** Partnered with Product, SRE and Sales to turn ambiguous customer requirements into production-grade AI guardrails and a robust system architecture."
    tags: [Multi-agent systems, Technical strategy, Agent evaluation, Semantic caching, AI guardrails]

  - org: "Valence"
    role: "Applied AI Engineer (Consultant)"
    location: "New York, USA (remote)"
    dates: "Apr 2025 – Jul 2025"
    bullets:
      - "Consulted for an AI coaching startup that has since raised **$50M+** in funding."
      - "**Engineered and shipped production LLM systems** that distil long histories of user–AI conversations into high-quality personalized context for long-term goal tracking."
      - "**Raised product quality and user experience** with personalized, real-time coaching insights, which increased user retention and improved conversation quality."
    tags: [Production LLM systems, Personalization, Long-term memory]

  - org: "Telepathy Labs"
    role: "Senior Research Engineer, NLP/IR"
    location: "Zürich, Switzerland"
    dates: "Jan 2024 – Mar 2025"
    bullets:
      - "**Owned the retrieval stack of a RAG-based conversational product search system.** Set up a reliable retrieval evaluation, introduced document expansion for dense retrieval, and merged re-ranking with post-filtering, improving answer quality and latency."
      - "**Led the company's move from pay-per-call closed-source LLMs (OpenAI) to self-hosted open-source models**, cutting cost and latency while matching quality with fine-tuned LoRA adapters."
      - "**Founded and co-supervised a company-wide internship program** (2 interns since summer 2024)."
      - "Drove the research behind two publications ([SciChat@EACL'24](https://aclanthology.org/2024.scichat-1.3/) and COLING'25)."
    tags: [RAG, Dense retrieval, LoRA / PEFT, Open-source LLMs, LLM cost optimization]

